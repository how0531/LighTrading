# LighTrade 個人單機部署
#
# 一個 docker-compose up -d 就跑完整套：
#   - backend  (FastAPI + Shioaji)  → :8000 (內部)
#   - frontend (React build + nginx)→ :5173 → 瀏覽器開 http://localhost:5173
#
# 啟動前確認 ./.env 已填好 API_KEY / SECRET_KEY（請參考 .env.example）。

services:
  backend:
    build:
      context: .
      dockerfile: lightning_trader/backend/Dockerfile
    container_name: lightrade-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LIGHTRADE_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      # Shioaji 偶爾會寫 log / 快取，外掛出來方便檢視
      - lightrade-data:/app/lightning_trader/data
    networks:
      - lightrade-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./lightning_trader/frontend
      dockerfile: Dockerfile
    container_name: lightrade-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"
    networks:
      - lightrade-net

networks:
  lightrade-net:
    driver: bridge

volumes:
  lightrade-data:
