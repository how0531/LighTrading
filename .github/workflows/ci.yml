name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lightning_trader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          # 顯式指向 requirements 檔；不加這行 setup-python 會去 repo root 找
          # 預設名稱 (requirements.txt / pyproject.toml) 找不到就直接 fail
          cache-dependency-path: lightning_trader/backend/requirements_backend.txt

      - name: Install test deps (no shioaji / pyqt5)
        # CI 不裝 shioaji（券商 wheel 沒上 PyPI）與 pyqt5（無圖形環境）
        # tests/ 都是離線單元，會繞過 core/__init__.py 透過直接 import
        # httpx 是 FastAPI TestClient 整合測試需要的
        run: |
          grep -viE '^(shioaji|pyqt5)' backend/requirements_backend.txt > /tmp/ci-req.txt
          pip install -r /tmp/ci-req.txt pytest httpx

      - name: Pytest
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lightning_trader/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: lightning_trader/frontend/package-lock.json

      - run: npm ci

      - name: TypeScript compile
        run: npx tsc -b --pretty false

      - name: Vitest
        run: npx vitest run

      - name: ESLint
        run: npx eslint . --max-warnings 0
